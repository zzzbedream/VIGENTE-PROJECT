[package]
name = "reference-vault"
version = "0.1.0"
edition = "2021"
description = "Vigente Protocol — Reference Lending Vault (credit-gated undercollateralized lending PoC)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.2.0"

[dev-dependencies]
soroban-sdk = { version = "21.2.0", features = ["testutils"] }
vigente-badge = { path = "../vigente-badge" }
mock-usdc = { path = "../mock-usdc" }
ed25519-dalek = "2"
rand = "0.8"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
