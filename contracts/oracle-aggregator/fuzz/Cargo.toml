# Objetivos de fuzz del agregador de oraculos.
#
# Se construye como workspace propio, que es la convencion de cargo-fuzz: el
# crate del contrato tiene `panic = "abort"` en su perfil release y libFuzzer
# necesita el suyo.
[package]
name = "oracle-aggregator-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.7"
arbitrary = { version = "1.3.2", features = ["derive"] }
soroban-sdk = { version = "21.2.0", features = ["testutils"] }
oracle-aggregator = { path = ".." }

[[bin]]
name = "precio_nunca_cero_ni_sin_tipo"
path = "fuzz_targets/precio_nunca_cero_ni_sin_tipo.rs"
test = false
doc = false
bench = false

[workspace]
