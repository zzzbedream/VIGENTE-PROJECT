# TTL keeper - closes the CAUSE of finding M-01.
#
# Soroban archives a contract instance when its TTL ledger passes, and an archived
# instance makes every real transaction against that contract fail. The badge
# instance had already expired unnoticed (H-04) and the pool was down to 2.8 days
# when we measured on 2026-09-02, because nobody owned the check. This runs it.
#
# A red job nobody looks at is the same failure mode we just had, so a failure also
# opens an issue.
name: ttl keeper

on:
  schedule:
    # Mondays 09:00 UTC. Weekly is enough: a healthy extend buys ~180 days and the
    # threshold alerts at 30, so there are ~21 chances to react before anything
    # archives.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      min_days:
        description: "Alert threshold in days"
        required: false
        default: "30"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 y no 20: varias dependencias declaran engines.node >= 22 y en 20
          # el install sale lleno de EBADENGINE.
          node-version: "22"

      # El keeper tiene su propio package.json y su propio lock, en
      # .github/keeper, con las dos unicas cosas que ttl-check.ts necesita:
      # @stellar/stellar-sdk y tsx. 90 paquetes en vez de los 1006 del arbol de
      # la web.
      #
      # Por que aislado: el keeper fallo cinco semanas seguidas por dependencias
      # de la APLICACION que no tienen nada que ver con comprobar un TTL --
      # primero un package-lock.json remanente dentro de web/, despues
      # @emnapi/runtime, una opcional de unos paquetes wasm32 que el lock
      # generado en Windows no traia para Linux. Un chequeo de infraestructura
      # no debe caerse porque la web cambio de empaquetador.
      #
      # Por que `npm ci` y con lock: una version intermedia de este arreglo usaba
      # `npm install` con las dos versiones fijadas pero SIN lock, lo que dejaba
      # las transitivas sin fijar en un job que tiene permiso issues:write. Eso
      # cambiaba un problema de fragilidad por uno de cadena de suministro.
      - name: Install the keeper's own pinned deps
        working-directory: .github/keeper
        run: npm ci --no-audit --no-fund

      # El script se copia junto a sus dependencias: node resuelve los imports
      # desde la carpeta del archivo que importa, no desde el cwd, asi que
      # ejecutarlo desde web/ no encontraria .github/keeper/node_modules.
      # La fuente sigue siendo web/scripts/ttl-check.ts, que es la que se usa en
      # local con `npm run ttl-check`: no hay dos copias que puedan divergir.
      - name: Check TTL of every watched instance
        id: ttl
        env:
          TTL_MIN_DAYS: ${{ github.event.inputs.min_days || '30' }}
          TTL_JSON: "1"
        run: |
          set -o pipefail
          cp web/scripts/ttl-check.ts .github/keeper/ttl-check.ts
          cd .github/keeper
          npx tsx ttl-check.ts 2>&1 | tee "$GITHUB_WORKSPACE/ttl-report.txt"

      - name: Open an issue when an instance needs attention
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'report unavailable';
            try { report = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/ttl-report.txt`, 'utf8'); } catch {}
            const title = 'TTL keeper: a contract instance needs an extend';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ttl-keeper',
            });
            const body = [
              'The weekly TTL check failed. An instance is below the threshold, archived, or unreachable.',
              '',
              'Runbook: `contracts/scripts/RUNBOOK-ttl.md`',
              '',
              '```',
              report.slice(0, 60000),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ttl-keeper'],
              });
            }
