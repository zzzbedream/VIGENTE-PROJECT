# TTL keeper - closes the CAUSE of finding M-01.
#
# Soroban archives a contract instance when its TTL ledger passes, and an archived
# instance makes every real transaction against that contract fail. The badge
# instance had already expired unnoticed (H-04) and the pool was down to 2.8 days
# when we measured on 2026-09-02, because nobody owned the check. This runs it.
#
# A red job nobody looks at is the same failure mode we just had, so a failure also
# opens an issue.
name: ttl keeper

on:
  schedule:
    # Mondays 09:00 UTC. Weekly is enough: a healthy extend buys ~180 days and the
    # threshold alerts at 30, so there are ~21 chances to react before anything
    # archives.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      min_days:
        description: "Alert threshold in days"
        required: false
        default: "30"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 y no 20: varias dependencias declaran engines.node >= 22 y en 20
          # el install sale lleno de EBADENGINE.
          node-version: "22"

      # ttl-check.ts importa UN paquete: @stellar/stellar-sdk. Instalar el arbol
      # entero de la web -1006 paquetes, con sharp, tailwind y next- para correr
      # un chequeo de TTL convertia cada dependencia de la aplicacion en una
      # forma de romper el keeper. Y rompio dos veces por eso: primero por un
      # package-lock.json remanente dentro de web/, y despues por @emnapi/runtime,
      # una dependencia opcional de unos paquetes wasm32 que el lock generado en
      # Windows no traia para Linux.
      #
      # El keeper no necesita nada de eso. Se instala solo lo que el script usa,
      # con version fija (las mismas que declara web/package.json), sin lockfile
      # y sin workspace. Asi el keeper deja de depender de la salud del arbol de
      # la aplicacion, que es lo que lo tuvo rojo cinco semanas.
      - name: Install only what the check needs
        run: npm install --no-save --no-audit --no-fund @stellar/stellar-sdk@14.4.2 tsx@4.22.3

      - name: Check TTL of every watched instance
        id: ttl
        working-directory: web
        env:
          TTL_MIN_DAYS: ${{ github.event.inputs.min_days || '30' }}
          TTL_JSON: "1"
        run: |
          set -o pipefail
          npx tsx scripts/ttl-check.ts 2>&1 | tee "$GITHUB_WORKSPACE/ttl-report.txt"

      - name: Open an issue when an instance needs attention
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'report unavailable';
            try { report = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/ttl-report.txt`, 'utf8'); } catch {}
            const title = 'TTL keeper: a contract instance needs an extend';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ttl-keeper',
            });
            const body = [
              'The weekly TTL check failed. An instance is below the threshold, archived, or unreachable.',
              '',
              'Runbook: `contracts/scripts/RUNBOOK-ttl.md`',
              '',
              '```',
              report.slice(0, 60000),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ttl-keeper'],
              });
            }
