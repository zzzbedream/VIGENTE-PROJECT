# Finding M-05 — a reviewer must be able to rebuild our wasm and get the same hash.
#
# This job rebuilds every contract with the pinned toolchain and the path remapping in
# contracts/scripts/build-reproducible.sh, then compares the result against the
# `reproducible_raw` values recorded in contracts/deployed-wasm-hashes.json.
#
# A mismatch means one of: source changed, toolchain changed, or the build stopped being
# deterministic. All three should fail loudly rather than be discovered at deploy time.
name: wasm reproducibility

# =============================================================================
# DISPARADORES AUTOMATICOS DESACTIVADOS el 2026-10-22. Se corre A MANO.
#
# POR QUE. Este job lleva rojo desde el 2026-09-08 y la causa raiz esta
# diagnosticada: `rustc` graba la ubicacion de cada archivo fuente usando el
# SEPARADOR DE RUTAS DEL SISTEMA ANFITRION, y `--remap-path-prefix` solo
# reescribe el prefijo. El wasm construido en Windows contiene
# `/cargo\registry\...\ledger.rs` y el de Linux `/cargo/registry/.../ledger.rs`.
# Bytes distintos, hash distinto. No se arregla con mas flags de remapeo, porque
# lo que queda despues del prefijo no es un prefijo.
#
# Detalle completo: `audit/12_FINDINGS_CLOSED.md`, seccion "M-05 - root cause
# found, 2026-10-21", con el dump de cadenas del wasm.
#
# Un job rojo permanente no detecta nada: entrena a no mirarlo. Ya nos paso con
# el keeper de TTL, que estuvo cinco semanas en rojo abriendo issues que nadie
# leyo. Mientras la causa no se arregle, este job informa un hecho conocido en
# cada push, en un repositorio publico.
#
# QUE LO REACTIVA, y es una sola cosa: construir la v4 en un CONTENEDOR Linux
# fijado, hacer de ese el unico camino de build sancionado, y re-basar
# `contracts/deployed-wasm-hashes.json` desde ahi. Con eso el hash es el mismo
# en CI y en cualquier maquina, y el job vuelve a tener sentido.
#
# Plan y responsable: `docs/private/pilot/TECH_DEBT.md`, seccion 3.
#
# COMO SE REACTIVA: descomentar las cuatro lineas de `push` y `pull_request`.
# =============================================================================
on:
  # push:
  #   paths: ['contracts/**', 'rust-toolchain.toml', '.github/workflows/wasm-reproducibility.yml']
  # pull_request:
  #   paths: ['contracts/**', 'rust-toolchain.toml']
  workflow_dispatch:

jobs:
  rebuild-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml drives the version; installing via rustup honours it.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Stellar CLI
        run: |
          curl -sSfL https://github.com/stellar/stellar-cli/releases/download/v23.1.4/stellar-cli-23.1.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar || cargo install --locked stellar-cli --version 23.1.4

      - name: Reproducible build
        run: bash contracts/scripts/build-reproducible.sh | tee /tmp/build.txt

      - name: Compare against manifest
        run: |
          python3 - <<'PY'
          import json, re, sys
          manifest = json.load(open('contracts/deployed-wasm-hashes.json'))
          built = {}
          name = None
          for line in open('/tmp/build.txt'):
              m = re.match(r'^(\S+)\s+raw=([0-9a-f]{64})', line)
              if m:
                  name, h = m.group(1), m.group(2)
                  built[name] = h
          failures = []
          for c, meta in manifest['contracts'].items():
              want = meta['reproducible_raw']
              got = built.get(c)
              if got is None:
                  failures.append(f'{c}: not built')
              elif got != want:
                  failures.append(f'{c}: expected {want}, built {got}')
              else:
                  print(f'{c}: reproducible OK ({got[:16]}...)')
          if failures:
              print('\nReproducibility check FAILED:')
              for f in failures:
                  print('  -', f)
              print('\nIf this change is intentional, rebuild locally with')
              print('  bash contracts/scripts/build-reproducible.sh')
              print('and update contracts/deployed-wasm-hashes.json in the same commit.')
              sys.exit(1)
          PY

      # Informational: what is actually on the ledger right now. Deployed binaries predate
      # the pin, so a mismatch here is expected and documented in the manifest.
      - name: Report on-chain hashes
        continue-on-error: true
        run: |
          python3 -c "
          import json
          m = json.load(open('contracts/deployed-wasm-hashes.json'))
          for c, v in m['contracts'].items():
              print(f\"{c}: deployed={v['deployed'][:16]}... matches_reproducible={v['matches_deployed']}\")
          "
