name: secret-scan

# Origen: incidente C-01 (2026-07-18). La ADMIN_SECRET del margin-controller
# estuvo hardcodeada en 7 archivos versionados y en un transcript de sesión.
# Este job impide que vuelva a entrar un secreto al repositorio.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar patrones de secreto en archivos versionados
        run: |
          set -uo pipefail
          PATTERNS=(
            'S[A-Z2-7]{55}'                 # llave secreta Stellar (seed)
            '-----BEGIN[A-Z ]*PRIVATE KEY'  # clave privada PEM
            'AKIA[0-9A-Z]{16}'              # AWS access key id
            'sk-[A-Za-z0-9]{20,}'           # token estilo OpenAI
            'VIGENTE_ORACLE_SEEDS_HEX=.'    # semillas del oráculo k-de-n
            'SERVICE_ROLE_KEY=.'            # service role de Supabase
          )
          FOUND=0
          for p in "${PATTERNS[@]}"; do
            # -I ignora binarios; excluye node_modules y este propio workflow.
            # `-e` es obligatorio: hay patrones que empiezan con '-' (claves PEM).
            if git grep -InE -e "$p" -- . \
                 ':(exclude)node_modules' ':(exclude)*/node_modules' \
                 ':(exclude).github/workflows/secret-scan.yml' \
                 ':(exclude).githooks/pre-commit' > /tmp/hits.txt 2>/dev/null; then
              echo "::error::Posible secreto detectado (patrón: $p)"
              # Publica solo el archivo y la línea, NUNCA el valor.
              cut -d: -f1,2 /tmp/hits.txt | sort -u
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo ""
            echo "Los secretos no van al repositorio: usa variables de entorno"
            echo "o un placeholder (<TU_ADMIN_SECRET>) en la documentación."
            exit 1
          fi
          echo "✅ Sin secretos detectados en archivos versionados."
